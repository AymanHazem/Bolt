spring:
  profiles:
    default: local

  mongodb:
    authentication-database: admin
    auto-index-creation: true

  threads:
    virtual:
      enabled: true

server:
  port: ${APP_PORT:8080}

app:
  default-ttl-hours: ${APP_DEFAULT_TTL_HOURS:24}
  # Alias generation parameters
  alias-length: ${APP_ALIAS_LENGTH:6}
  max-alias-generation-retries: ${APP_MAX_ALIAS_RETRIES:10}
  # QR code parameters
  qr-code-size: ${APP_QR_SIZE:300}
  qr-code-margin: ${APP_QR_MARGIN:1}
  qr-cache-ttl-days: ${APP_QR_CACHE_TTL:7}

logging:
  level:
    com.bolt: ${LOG_LEVEL:INFO}
